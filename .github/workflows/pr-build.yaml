name: pr-build

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  packages: write
  contents: read
  statuses: read
  actions: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      profiles: ${{ steps.profiles.outputs.matrix }}    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit    
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: build
        run: |
          go install
          cp -Rpv $(go list -m -f '{{.Dir}}' tailscale.com) tailscale
          sudo chmod 0755 tailscale/ && sudo chown -R $USER. tailscale/
          cd tailscale
          CGO_ENABLED=0 go build -o derper  ./cmd/derper/
